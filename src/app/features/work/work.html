<section id="work" class="work container" aria-labelledby="work-title">
  <div class="work__header">
    <h2 id="work-title" class="work__title font-display">Selected Work</h2>

    <div class="work__filter" role="group" aria-label="Filter work by category">
      @for (category of categories; track category.id) {
        <button
          type="button"
          class="work__filter-btn"
          [attr.aria-pressed]="activeCategory() === category.id"
          (click)="select(category.id)"
        >
          {{ category.label }}
        </button>
      }
    </div>
  </div>

  <div class="work__grid">
    @for (item of visibleItems(); track item.id) {
      <app-work-card [item]="item" />
    }
  </div>
</section>
