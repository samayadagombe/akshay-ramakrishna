<section id="contact" class="contact" aria-labelledby="contact-title">
  <div class="contact__inner">
    <p class="eyebrow contact__eyebrow">Get in touch</p>
    <h2 id="contact-title" class="contact__title font-display">Let's work together</h2>
    <p class="contact__lead">
      Available for product design, UX strategy, and graphic design commissions.
    </p>

    <dl class="contact__list">
      @for (item of items; track item.label) {
        <div class="contact__row">
          <dt>{{ item.label }}</dt>
          <dd>
            @if (item.href) {
              <a
                [href]="item.href"
                [attr.target]="isExternal(item.href) ? '_blank' : null"
                [attr.rel]="isExternal(item.href) ? 'noopener noreferrer' : null"
                >{{ item.value }}</a
              >
            } @else {
              {{ item.value }}
            }
          </dd>
        </div>
      }
    </dl>

    <div class="contact__action">
  <a
    class="contact__btn"
    href="https://mail.google.com/mail/?view=cm&fs=1&to=eminem21089@gmail.com"
    target="_blank"
    rel="noopener noreferrer"
  >
    Send an Email
  </a>
</div>
  </div>
</section>
