name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production --base-href /akshay-ramakrishna/

      - name: Find Angular build output
        id: output
        shell: bash
        run: |
          echo "Contents of dist:"
          find dist -maxdepth 5 -type f | sort

          INDEX_FILE=$(find dist -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found inside dist/"
            exit 1
          fi

          OUTPUT_DIR=$(dirname "$INDEX_FILE")

          echo "Found index.html:"
          echo "$INDEX_FILE"

          echo "Pages artifact directory:"
          echo "$OUTPUT_DIR"

          echo "path=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4