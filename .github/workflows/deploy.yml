name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production --base-href /akshay-ramakrishna/

      - name: Show build output
        run: |
          echo "===== dist ====="
          find dist -maxdepth 5 -type f | sort

      - name: Find Angular browser output
        id: find-output
        run: |
          if [ -d "dist/akshay-ramakrishna/browser" ]; then
            echo "path=dist/akshay-ramakrishna/browser" >> "$GITHUB_OUTPUT"
          elif [ -d "dist/akshay-ramakrishna" ]; then
            echo "path=dist/akshay-ramakrishna" >> "$GITHUB_OUTPUT"
          else
            echo "Angular build output not found."
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find-output.outputs.path }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4